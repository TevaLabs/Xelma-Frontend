name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Run tests
        run: pnpm exec vitest run --reporter=verbose --exclude='src/components/__tests__/BetModal.test.tsx' --exclude='src/components/Navbar.test.tsx' --exclude='src/pages/Dashboard.terminal.test.tsx' --exclude='src/components/BetModal.test.tsx' --exclude='src/__tests__/accessibility-smoke.test.tsx' --exclude='src/components/PredictionControls.test.tsx' --exclude='src/components/RoundTimeline.test.tsx'

      - name: Run accessibility smoke tests
        run: pnpm run test:a11y
