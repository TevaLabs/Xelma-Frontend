<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0F1A" />
    <title>Offline — Xelma</title>
    <style>
      :root {
        color-scheme: dark;
        background: #0a0f1a;
        color: #f3f4f6;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      .panel {
        max-width: 520px;
        width: 100%;
        padding: 32px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.9);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.2);
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 4vw, 2.75rem);
      }
      p {
        margin: 0 0 24px;
        line-height: 1.75;
        color: #cbd5e1;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }
      a,
      button {
        border: none;
        border-radius: 9999px;
        padding: 14px 24px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      a {
        text-decoration: none;
        color: #0a0f1a;
        background: #c7d2fe;
      }
      button {
        background: #1d4ed8;
        color: #ffffff;
      }
      button:hover,
      a:hover {
        opacity: 0.95;
      }
      .hint {
        margin-top: 16px;
        color: #94a3b8;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main class="panel" role="main">
      <h1>You're offline</h1>
      <p>
        Xelma is currently unavailable because your device is offline. The app shell may still be available for previously loaded content.
      </p>
      <div class="actions">
        <button type="button" id="retry">Try again</button>
        <a href="/">Go to home</a>
      </div>
      <p class="hint">
        When you are back online, tap Retry to reload the app.
      </p>
    </main>
    <script>
      const retryButton = document.getElementById('retry');
      retryButton?.addEventListener('click', () => location.reload());
      window.addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
